<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://glitch.com/favicon.ico" />

    <title>Fortune Teller</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- this is the start of content -->
    <h1>Fortune Teller</h1>

    <img src="job.jpeg" alt="Future jobs" width="400">

    <form name="fortuneTeller" id="fortuneTeller" action="fortune.html">

      <label for="namefield">Name:</label>
      <input
        type="text"
        id="namefield"
        name="name"
        placeholder="your name"
        required
      >
      <br>

      <label for="questionfield">Question:</label>
      <input
        type="text"
        id="questionfield"
        name="question"
        placeholder="a yes or no question"
      >
      <br>

      <label for="luckyNumber">Lucky Number:</label>
      <input
        type="number"
        id="luckyNumber"
        name="luckyNumber"
      >
      <br>

      <label for="futureJob">Future Job:</label>
      <select id="futureJob" name="futureJob">
        <option value="engineer">Engineer</option>
        <option value="doctor">Doctor</option>
        <option value="business">Business</option>
      </select>
      <br>

      <label for="details">Tell me about yourself:</label>
      <textarea
        id="details"
        name="details"
        rows="4"
        cols="30"
      ></textarea>
      <br>

      <button type="submit">Submit</button>

    </form>

    <div id="fortune"></div>
  </body>
</html>
